<head>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   RANKSPARK ADMIN — design system
   Ink #06060B, accent ramp c1..c5, Sora for UI, JetBrains Mono for numbers.
   Deliberately matches the product so the two never look like different apps.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --c1:#6D5CFF; --c2:#B45CFF; --c3:#FF7A45; --c4:#FFC24B; --c5:#22D3EE;
  --ink:#06060B;
  --bg-1:#0A0A14; --bg-2:#0E0E1C; --surf:#12121F; --surf-2:#171728;
  --line:rgba(255,255,255,.09);
  --line-2:rgba(255,255,255,.14);
  --tx:#F4F5FB; --tx-2:#A2A8C3; --tx-3:#6E7594;
  --ok:#2EE3A2; --warn:#FFC24B; --bad:#FF5A76;
  --r:14px; --r-lg:20px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sb:264px;
  --font:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="light"] {
  --ink:#F7F8FC; --bg-1:#FFFFFF; --bg-2:#F4F5FA; --surf:#FFFFFF; --surf-2:#F7F8FC;
  --line:rgba(16,20,45,.10); --line-2:rgba(16,20,45,.16);
  --tx:#0E1226; --tx-2:#535B7A; --tx-3:#7B839F;
}

*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--tx);
  font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
/* ambient gradient wash — the product's signature */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 52% 44% at 12% -6%, color-mix(in srgb,var(--c1) 16%,transparent), transparent 62%),
    radial-gradient(ellipse 44% 40% at 96% 4%, color-mix(in srgb,var(--c2) 12%,transparent), transparent 60%),
    radial-gradient(ellipse 60% 44% at 60% 104%, color-mix(in srgb,var(--c5) 8%,transparent), transparent 62%);
}
[data-theme="light"] body::before{opacity:.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── auth ─────────────────────────────────────────────────────────────── */
[hidden]{display:none!important}
.auth{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-card{
  width:min(420px,100%);padding:34px 30px;border-radius:var(--r-lg);
  border:1px solid var(--line);
  background:linear-gradient(165deg,color-mix(in srgb,var(--surf) 92%,var(--c1) 8%),var(--bg-2));
  box-shadow:0 40px 90px -34px rgba(0,0,0,.85);
  animation:up .5s var(--ease) both;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.auth-logo{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 12px 28px -10px color-mix(in srgb,var(--c1) 80%,transparent);
  margin-bottom:18px;
}
.auth-logo svg{width:22px;height:22px;color:#fff}
.auth h1{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.auth p{margin:0 0 22px;font-size:13px;color:var(--tx-2)}
.field{display:grid;gap:6px;margin-bottom:13px}
.field label{font-size:11.5px;font-weight:600;color:var(--tx-2)}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--tx);
  font-size:13.5px;outline:none;transition:border-color .2s,background .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--c2);background:color-mix(in srgb,var(--c2) 7%,var(--bg-2));
}
.field input::placeholder{color:var(--tx-3)}
.field .hint{font-size:10.5px;color:var(--tx-3)}
.field.bad input{border-color:var(--bad)}
.field.bad .hint{color:var(--bad)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 17px;border-radius:11px;font-size:13px;font-weight:650;
  transition:transform .22s var(--ease),filter .22s,background .22s,border-color .22s;
  white-space:nowrap;
}
.btn:active{transform:translateY(0) scale(.985)}
.btn-p{color:#fff;background:linear-gradient(105deg,var(--c1),var(--c2));
  box-shadow:0 13px 28px -14px color-mix(in srgb,var(--c1) 90%,transparent)}
.btn-p:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn-g{border:1px solid var(--line);background:var(--surf-2);color:var(--tx-2)}
.btn-g:hover{border-color:var(--line-2);color:var(--tx)}
.btn-d{border:1px solid color-mix(in srgb,var(--bad) 42%,transparent);
  background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn-d:hover{background:color-mix(in srgb,var(--bad) 20%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-full{width:100%}
.btn-sm{padding:7px 12px;font-size:11.5px;border-radius:9px}
.btn svg{width:15px;height:15px}

.divider{display:flex;align-items:center;gap:11px;margin:16px 0;color:var(--tx-3);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

.note{
  display:flex;gap:9px;padding:11px 13px;border-radius:11px;margin-top:14px;
  font-size:11.5px;line-height:1.55;color:var(--tx-2);
  border:1px solid var(--line);background:var(--bg-2);
}
.note svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--c5)}
.note.bad{border-color:color-mix(in srgb,var(--bad) 34%,transparent);
  background:color-mix(in srgb,var(--bad) 8%,transparent);color:#ffb3c0}
.note.bad svg{color:var(--bad)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 34%,transparent);
  background:color-mix(in srgb,var(--warn) 8%,transparent)}
.note.warn svg{color:var(--warn)}

/* ─── shell ────────────────────────────────────────────────────────────── */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb) 1fr;min-height:100dvh}
.shell.collapsed{--sb:72px}

.side{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--bg-1) 86%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  transition:width .3s var(--ease);
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mk{
  width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 8px 20px -8px color-mix(in srgb,var(--c1) 85%,transparent);
}
.brand-mk svg{width:17px;height:17px;color:#fff}
.brand-tx{font-size:14.5px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand-tx span{background:linear-gradient(100deg,var(--c1),var(--c2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:9.5px;color:var(--tx-3);letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.collapsed .brand-tx,.collapsed .brand-sub,.collapsed .nav-t,.collapsed .nav-cap,
.collapsed .side-foot-tx,.collapsed .env{display:none}
.collapsed .brand{justify-content:center;padding-inline:0}

.nav{flex:1;overflow-y:auto;padding:6px 10px 14px;display:grid;gap:1px;align-content:start}
.nav-cap{padding:14px 8px 6px;font-size:9.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tx-3)}
.nav-i{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;
  color:var(--tx-2);font-size:13px;font-weight:500;text-decoration:none;
  transition:background .18s,color .18s;position:relative;
}
.nav-i:hover{background:rgba(255,255,255,.045);color:var(--tx)}
.nav-i.on{color:var(--tx);background:linear-gradient(100deg,
  color-mix(in srgb,var(--c1) 22%,transparent),color-mix(in srgb,var(--c2) 12%,transparent))}
.nav-i.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:linear-gradient(var(--c1),var(--c2))}
.nav-i svg{width:17px;height:17px;flex:none}
.nav-i .badge{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 6px;
  border-radius:99px;background:rgba(255,255,255,.09);color:var(--tx-2)}
.collapsed .nav-i{justify-content:center;padding-inline:0}
.collapsed .nav-i .badge{display:none}

.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.side-user{display:flex;align-items:center;gap:10px}
.side-ava{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--c2),var(--c1));color:#fff;font-size:12px;font-weight:650;
  background-size:cover;background-position:center}
.side-foot-tx{min-width:0}
.side-foot-tx b{display:block;font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.side-foot-tx small{display:block;font-size:10px;color:var(--tx-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ─── main ─────────────────────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0}
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 22px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--ink) 84%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.icon-b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--tx-2);border:1px solid transparent;transition:background .18s,color .18s}
.icon-b:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.icon-b svg{width:17px;height:17px}

.search{position:relative;flex:1;max-width:440px;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--tx-3);pointer-events:none}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--tx);font-size:12.5px;outline:none;
  transition:border-color .2s}
.search input:focus{border-color:var(--c2)}
.search kbd{position:absolute;right:9px;font-family:var(--mono);font-size:9.5px;
  padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--tx-3)}

.env{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  font-size:10.5px;font-weight:650;letter-spacing:.05em;
  border:1px solid color-mix(in srgb,var(--ok) 34%,transparent);
  background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok)}
.env.mock{border-color:color-mix(in srgb,var(--warn) 38%,transparent);
  background:color-mix(in srgb,var(--warn) 11%,transparent);color:var(--warn)}
.env i{width:6px;height:6px;border-radius:50%;background:currentColor}

.page{flex:1;padding:24px 22px 40px;max-width:1500px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  flex-wrap:wrap;margin-bottom:20px}
.page-h h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.024em}
.page-h p{margin:5px 0 0;font-size:13px;color:var(--tx-2);max-width:64ch}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ─── primitives ───────────────────────────────────────────────────────── */
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surf);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 17px;border-bottom:1px solid var(--line)}
.card-h h2,.card-h h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em}
.card-h p{margin:3px 0 0;font-size:11.5px;color:var(--tx-3)}
.card-b{padding:17px}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}

.kpi{position:relative;overflow:hidden;padding:17px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--surf);
  transition:transform .28s var(--ease),border-color .28s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line-2)}
.kpi::after{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:radial-gradient(150% 90% at 100% 0%,color-mix(in srgb,var(--k,var(--c1)) 15%,transparent),transparent 58%)}
.kpi-t{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;
  color:var(--tx-3);letter-spacing:.05em;text-transform:uppercase;position:relative;z-index:1}
.kpi-t svg{width:14px;height:14px;color:var(--k,var(--c1))}
.kpi-v{margin-top:11px;font-family:var(--mono);font-size:27px;font-weight:600;
  letter-spacing:-.03em;line-height:1;position:relative;z-index:1}
.kpi-d{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11px;
  color:var(--tx-3);position:relative;z-index:1}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:650;font-family:var(--mono)}
.trend.up{color:var(--ok)} .trend.dn{color:var(--bad)} .trend.flat{color:var(--tx-3)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:10px;font-weight:650;letter-spacing:.03em;white-space:nowrap;
  border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--tx-2)}
.tag.ok{border-color:color-mix(in srgb,var(--ok) 36%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.tag.warn{border-color:color-mix(in srgb,var(--warn) 36%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.tag.bad{border-color:color-mix(in srgb,var(--bad) 36%,transparent);
  background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.tag.c5{border-color:color-mix(in srgb,var(--c5) 36%,transparent);
  background:color-mix(in srgb,var(--c5) 12%,transparent);color:var(--c5)}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:2;padding:10px 13px;text-align:left;
  font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-3);
  background:var(--surf);border-bottom:1px solid var(--line)}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);color:var(--tx-2)}
.tbl tbody tr{transition:background .16s}
.tbl tbody tr:hover{background:rgba(255,255,255,.03)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl td b{color:var(--tx);font-weight:600}
.tbl .num{text-align:right;font-family:var(--mono)}
.tbl-wrap{overflow:auto;max-height:520px}

.empty{padding:44px 22px;text-align:center}
.empty svg{width:34px;height:34px;color:var(--tx-3);margin-bottom:12px}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:650}
.empty p{margin:0 auto 16px;max-width:400px;font-size:12.5px;color:var(--tx-2);line-height:1.6}

.sk{border-radius:8px;background:linear-gradient(90deg,
  rgba(255,255,255,.045) 25%,rgba(255,255,255,.085) 37%,rgba(255,255,255,.045) 63%);
  background-size:400% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.sk-l{height:11px;margin:7px 0}

.toggle{position:relative;width:42px;height:24px;flex:none;border-radius:99px;
  background:var(--line-2);transition:background .26s var(--ease)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.36);
  transition:transform .26s var(--ease)}
.toggle[aria-checked="true"]{background:linear-gradient(100deg,var(--c1),var(--c2))}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}

.row{display:flex;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-t{flex:1;min-width:0}
.row-t b{display:block;font-size:13px;font-weight:600}
.row-t small{display:block;margin-top:3px;font-size:11px;color:var(--tx-3);line-height:1.5}

/* ─── drawer / modal ───────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(3,3,9,.66);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim:not(.on){pointer-events:none!important}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(560px,100%);
  display:flex;flex-direction:column;border-left:1px solid var(--line);
  background:var(--bg-1);box-shadow:-30px 0 70px -30px rgba(0,0,0,.8);
  transform:translateX(100%);transition:transform .36s var(--ease)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:16px;font-weight:650;flex:1}
.drawer-b{flex:1;overflow-y:auto;padding:20px}
.drawer-f{display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;
  border-top:1px solid var(--line);background:var(--bg-2)}

.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:120;display:grid;gap:9px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--surf-2);font-size:12.5px;
  box-shadow:0 20px 44px -20px rgba(0,0,0,.85);animation:tin .3s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast svg{width:15px;height:15px;flex:none}
.toast.ok svg{color:var(--ok)} .toast.bad svg{color:var(--bad)}

/* ─── charts ───────────────────────────────────────────────────────────── */
.chart{width:100%;height:190px;display:block;overflow:visible}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:11px;align-items:center;
  padding:8px 0;font-size:12px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .8s var(--ease)}

/* ─── responsive ───────────────────────────────────────────────────────── */
@media (max-width:940px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:80;width:264px;
    transform:translateX(-100%);transition:transform .3s var(--ease)}
  .side.open{transform:none}
  .page{padding:18px 14px 90px}
  .top{padding:11px 14px}

   MOCK MODE
   With no Firebase config the whole app runs against an in-memory dataset so
   every screen can be reviewed, clicked and demoed before real keys exist.
   Nothing is faked once real config is supplied — the same code paths run
   against Firestore.
   ═══════════════════════════════════════════════════════════════════════════ */

  date: v => {
    if (!v) return '—';
    const d = v.toDate ? v.toDate() : new Date(v);
    return isNaN(d) ? '—' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

  dt: v => {
    if (!v) return '—';

  },
  ago: v => {
    if (!v) return '—';
    const d = v.toDate ? v.toDate() : new Date(v);
    const s = (Date.now() - d.getTime()) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';

/* ─── confirmation that cannot be clicked through by muscle memory ───── */
function confirmTyped({ title, body, word = 'CONFIRM', danger = true }) {
  return new Promise(resolve => {
    const scrim = document.createElement('div');
    scrim.className = 'scrim on';
    scrim.style.display = 'grid';
    scrim.style.placeItems = 'center';
    scrim.style.padding = '20px';
    scrim.innerHTML = `
      <div class="card" style="width:min(440px,100%)" role="alertdialog" aria-modal="true">
        <div class="card-h"><div><h2>${esc(title)}</h2></div></div>

        </div>
        <div class="drawer-f">
          <button class="btn btn-g" id="cf-no">Cancel</button>
          <button class="btn ${danger ? 'btn-d' : 'btn-p'}" id="cf-yes" disabled>Confirm</button>
        </div>
      </div>`;
    document.body.appendChild(scrim);
    const inp = $('#cf-in', scrim), yes = $('#cf-yes', scrim);
    inp.focus();
    inp.addEventListener('input', () => { yes.disabled = inp.value.trim() !== word; });
    const done = v => { scrim.remove(); resolve(v); };
    $('#cf-no', scrim).onclick = () => done(false);
    yes.onclick = () => done(true);
    scrim.addEventListener('click', e => { if (e.target === scrim) done(false); });
    document.addEventListener('keydown', function k(e) {
      if (!document.body.contains(scrim)) { document.removeEventListener('keydown', k); return; }
      if (e.key === 'Escape') { done(false); document.removeEventListener('keydown', k); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   DATA ACCESS — one API, two backends
   Every screen calls these; nothing touches Firestore directly. That keeps
   mock and live behaviour identical and makes the security surface small.
   ═══════════════════════════════════════════════════════════════════════ */
const db = {
  async list(coll) {
    if (!state.live) return structuredClone(MOCK[coll] ?? []);
    const { collection, getDocs } = state.fb.mods.fs;
    const snap = await getDocs(collection(state.fb.db, coll));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async get(coll, id) {
    if (!state.live) {
      if (coll === 'config') return structuredClone(MOCK.config[id] ?? null);
      return structuredClone((MOCK[coll] ?? []).find(x => x.id === id) ?? null);
    }
    const { doc, getDoc } = state.fb.mods.fs;
    const d = await getDoc(doc(state.fb.db, coll, id));
    return d.exists() ? { id: d.id, ...d.data() } : null;
  },
  async set(coll, id, data, merge = true) {
    if (!state.live) {
      if (coll === 'config') { MOCK.config[id] = { ...(MOCK.config[id] || {}), ...data }; return; }
      const arr = MOCK[coll] ?? (MOCK[coll] = []);
      const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = merge ? { ...arr[i], ...data } : { id, ...data };
      else arr.push({ id, ...data });
      return;
    }
    const { doc, setDoc, serverTimestamp } = state.fb.mods.fs;
    await setDoc(doc(state.fb.db, coll, id),
      { ...data, updatedAt: serverTimestamp() }, { merge });
  },
  async del(coll, id) {
    if (!state.live) {
      const arr = MOCK[coll] ?? [];
      const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr.splice(i, 1);
      return;
    }
    const { doc, deleteDoc } = state.fb.mods.fs;
    await deleteDoc(doc(state.fb.db, coll, id));
  },
  /* Append-only audit trail. Every privileged action writes one of these. */
  async audit(action, target, reason = '') {
    const entry = {
      adminUid: state.user?.uid || 'demo-admin',
      adminEmail: state.user?.email || 'demo@local',
      action, target, reason,
      at: new Date().toISOString()
    };
    if (!state.live) { MOCK.auditLog.unshift({ id: 'a' + Date.now(), ...entry }); return; }
    const { collection, addDoc, serverTimestamp } = state.fb.mods.fs;
    await addDoc(collection(state.fb.db, 'auditLog'), { ...entry, at: serverTimestamp() });
  }
};

  try { return JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch { return null; }
}
function saveConfig(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function clearConfig() { localStorage.removeItem(CFG_KEY); }

async function initFirebase() {
  const cfg = window.RANKSPARK_FIREBASE_CONFIG || storedConfig();
  if (!cfg?.apiKey || !cfg?.projectId) { state.live = false; return null; }
  try {
    const [appM, authM, fsM, stM] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js'),
      import(SDK + 'firebase-storage.js')
    ]);
    const app = appM.initializeApp(cfg);
    state.fb = {
      app,
      auth: authM.getAuth(app),
      db: fsM.getFirestore(app),
      storage: stM.getStorage(app),
      mods: { app: appM, auth: authM, fs: fsM, st: stM }
    };
    state.live = true;
    return state.fb;
  } catch (e) {
    console.error('[admin] Firebase init failed', e);
    state.live = false;
    return null;
  }
}

/* The allowlist gate. An authenticated user is NOT an admin until a doc
   exists at /admins/{uid}; the client check is a UX affordance and the
   Firestore rules in firestore.rules are the real enforcement. */
async function checkAdmin(uid) {
  if (!state.live) return true;                 // mock mode: always allowed
  const { doc, getDoc } = state.fb.mods.fs;
  const d = await getDoc(doc(state.fb.db, 'admins', uid));
  return d.exists();
}

/* ─── router ─────────────────────────────────────────────────────────── */
const routes = new Map();
function route(name, render) { routes.set(name, render); }

async function go(name, params = {}) {
  if (!routes.has(name)) name = 'dashboard';
  /* Any open drawer belongs to the screen we are leaving. Its scrim is
     position:fixed, so leaving it mounted silently blocks every click on the
     next screen — caught in testing when Maintenance became unclickable. */
  closeDrawer();
  state.route = name;
  if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
  $$('.nav-i').forEach(a => a.classList.toggle('on', a.dataset.route === name));
  const host = $('#page');
  if (!host) return;
  host.innerHTML = `<div class="grid g-kpi">${'<div class="kpi"><div class="sk sk-l" style="width:44%"></div><div class="sk" style="height:26px;margin-top:12px;width:60%"></div></div>'.repeat(4)}</div>`;
  try {
    await routes.get(name)(host, params);
  } catch (e) {
    console.error(e);
    host.innerHTML = `<div class="card"><div class="empty">${ico('warn', 34)}
      <h3>Something went wrong on this screen</h3>
      <p>${esc(e.message || 'Unknown error')}</p>
      <button class="btn btn-g" onclick="location.reload()">Reload</button></div></div>`;
  }
}
window.addEventListener('hashchange', () => go(location.hash.slice(1) || 'dashboard'));

/* ─── drawer ─────────────────────────────────────────────────────────── */
function drawer({ title, body, footer, onMount }) {
  let scrim = $('#dr-scrim'), dr = $('#dr');
  if (!scrim) {
    scrim = document.createElement('div'); scrim.id = 'dr-scrim'; scrim.className = 'scrim';
    dr = document.createElement('aside'); dr.id = 'dr'; dr.className = 'drawer';
    dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
    document.body.append(scrim, dr);
    scrim.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && dr.classList.contains('on')) closeDrawer();
    });
  }
  dr.innerHTML = `
    <header class="drawer-h">
      <h2>${esc(title)}</h2>
      <button class="icon-b" data-dr-x aria-label="Close">${ico('x', 17)}</button>
    </header>
    <div class="drawer-b">${body}</div>
    ${footer ? `<footer class="drawer-f">${footer}</footer>` : ''}`;
  $('[data-dr-x]', dr).onclick = closeDrawer;
  requestAnimationFrame(() => { scrim.classList.add('on'); dr.classList.add('on'); });
  onMount?.(dr);
  const f = dr.querySelector('input,select,textarea,button:not([data-dr-x])');
  f?.focus();
  return dr;
}
function closeDrawer() {
  $('#dr-scrim')?.classList.remove('on');
  $('#dr')?.classList.remove('on');
}

/* ─── misc ───────────────────────────────────────────────────────────── */
function csv(rows, name) {
  if (!rows.length) return toast('Nothing to export', 'bad');
  const cols = Object.keys(rows[0]);
  const body = [cols.join(','), ...rows.map(r => cols.map(c => {
    const v = r[c] ?? '';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
  const a = document.createElement('a');
  a.href = url; a.download = name + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported ' + rows.length + ' rows');
}
const trend = (cur, prev) => {
  if (!prev) return { cls: 'flat', txt: '—' };
  const d = ((cur - prev) / prev) * 100;
  if (Math.abs(d) < 0.5) return { cls: 'flat', txt: '0%' };
  return { cls: d > 0 ? 'up' : 'dn', txt: (d > 0 ? '↑' : '↓') + Math.abs(d).toFixed(0) + '%' };
};

  const spark = (data, key, color) => {
    if (data.length < 2) return '<div class="empty" style="padding:20px">Not enough data yet</div>';
    const vals = data.map(d => d[key] || 0);
    const max = Math.max(...vals), min = Math.min(...vals);
    const W = 600, H = 170, P = 6;
    const X = i => P + i * ((W - P * 2) / (vals.length - 1));
    const Y = v => H - P - ((v - min) / (max - min || 1)) * (H - P * 2 - 14);
    const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"

      <defs><linearGradient id="g-${key}" x1="0" y1="0" x2="0" y2="1">

      <polygon points="${P},${H - P} ${pts} ${W - P},${H - P}" fill="url(#g-${key})"/>

  };

  const topBooks = [...books]

    </div>

    <div class="grid g-kpi" style="margin-bottom:14px">

      ${kpi('var(--c2)', 'chart', 'New signups', fmt.n(signNow), `over ${days} days`, trend(signNow, signPrev))}
      ${kpi('var(--c4)', 'card', 'Revenue', fmt.money(revNow), `over ${days} days`, trend(revNow, revPrev))}

    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      <section class="card">
        <div class="card-h">
          <div><h2>Daily active users</h2><p>Dashed line is the period average</p></div>
          <span class="tag c5">${fmt.n(dauNow)} today</span>
        </div>
        <div class="card-b">${spark(win, 'dau', '#6D5CFF')}</div>
      </section>
      <section class="card">
        <div class="card-h">

          <span class="tag ok">${fmt.money(revNow)}</span>
        </div>
        <div class="card-b">${spark(win, 'revenue', '#22D3EE')}</div>
      </section>
    </div>

    <div class="grid g-2">

        <div class="card-b">
          ${(() => {
            const steps = [
              { l: 'Signed up', v: users.length, c: 'var(--c1)' },

              { l: 'Started a trial', v: Math.round(users.length * 0.31), c: 'var(--c3)' },

            return steps.map(s => `

                 cursor:pointer;transition:border-color .2s,background .2s">

          <div style="margin-top:9px;font-size:12.5px;font-weight:600">Drop a ZIP here, or click to browse</div>
          <div style="margin-top:3px;font-size:11px;color:var(--tx-3)">Uploads to Firebase Storage at
            <span class="mono">books/{bookId}/</span></div>
        </div>
        <div id="bf-prog" hidden style="margin-top:9px">
          <div class="bar"><i id="bf-bar" style="width:0"></i></div>
          <div class="hint" id="bf-ptxt" style="margin-top:5px"></div>
        </div>
        <input type="file" id="bf-file" accept=".zip,application/zip,application/json" hidden>
      </div>

      <div class="card" style="margin-top:6px">
        <div class="card-h"><div><h3>Preview in RankSpark</h3>
          <p>How this card renders inside the app</p></div></div>
        <div class="card-b">
          <div id="bf-prev" style="border:1px solid var(--line);border-radius:14px;overflow:hidden;
            background:linear-gradient(145deg,rgba(14,22,42,.9),rgba(8,13,28,.94))"></div>
        </div>
      </div>

      ${isNew ? '' : `<div class="note bad" style="margin-top:16px">${ico('warn', 14)}
        <span><b>Danger zone.</b> Deleting removes the catalog entry and its Storage
        files. Students who already imported it keep their local copy.</span></div>
        <button class="btn btn-d btn-full" id="bf-del" style="margin-top:9px">${ico('trash', 15)} Delete this book</button>`}`,
    footer: `<button class="btn btn-g" data-x>Cancel</button>
             <button class="btn btn-p" id="bf-save">${isNew ? 'Create book' : 'Save changes'}</button>`,
    onMount(dr) {
      const prev = () => {
        const n = $('#bf-name').value || 'Untitled book';
        const d = $('#bf-desc').value || 'No description yet';
        const c = $('#bf-count').value || 0;
        const t = $('#bf-tier').value;
        $('#bf-prev').innerHTML = `
          <div style="height:74px;background:linear-gradient(140deg,#6D5CFF44,#B45CFF22);
            display:grid;place-items:center;opacity:.75">${ico('book', 26)}</div>
          <div style="padding:12px 14px">
            <b style="font-size:13px">${esc(n)}</b>
            <div style="font-size:11px;color:var(--tx-3);margin-top:4px">${esc(d)}</div>
            <div style="display:flex;gap:6px;margin-top:9px">
              <span class="tag c5 mono">${fmt.n(+c)} questions</span>
              <span class="tag">${esc(t)}</span></div>
          </div>`;
      };
      ['bf-name', 'bf-desc', 'bf-count', 'bf-tier'].forEach(id =>
        $('#' + id).addEventListener('input', prev));
      $('#bf-tier').addEventListener('change', prev);
      prev();

      /* Auto-slug the id from the name, but only while creating. */
      if (isNew) {
        $('#bf-name').addEventListener('input', e => {
          $('#bf-id').value = e.target.value.toLowerCase()
            .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
        });
      }

      const drop = $('#bf-drop'), file = $('#bf-file');
      drop.onclick = () => file.click();
      drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.style.borderColor = 'var(--c2)';
        drop.style.background = 'color-mix(in srgb,var(--c2) 8%,transparent)';
      }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
        e.preventDefault(); drop.style.borderColor = ''; drop.style.background = '';
      }));
      drop.addEventListener('drop', e => upload(e.dataTransfer.files[0]));
      file.onchange = () => upload(file.files[0]);

      async function upload(f) {
        if (!f) return;
        const id = $('#bf-id').value.trim();
        if (!id) return toast('Give the book a name first', 'bad');
        $('#bf-prog').hidden = false;
        const bar = $('#bf-bar'), txt = $('#bf-ptxt');

        if (!state.live) {
          /* Mock: animate a believable upload so the flow is reviewable. */
          let p = 0;
          txt.textContent = `Uploading ${f.name} (${fmt.bytes(f.size)})…`;
          const iv = setInterval(() => {
            p = Math.min(100, p + 9 + Math.random() * 13);
            bar.style.width = p + '%';
            if (p >= 100) { clearInterval(iv);
              txt.innerHTML = `<span style="color:var(--ok)">Uploaded ${esc(f.name)} — demo mode, nothing sent</span>`; }
          }, 130);
          return;
        }
        const { ref, uploadBytesResumable, getDownloadURL } = state.fb.mods.st;
        const r = ref(state.fb.storage, `books/${id}/${f.name}`);
        const task = uploadBytesResumable(r, f);
        task.on('state_changed',
          s => { const p = (s.bytesTransferred / s.totalBytes) * 100;
                 bar.style.width = p + '%';
                 txt.textContent = `${p.toFixed(0)}% — ${fmt.bytes(s.bytesTransferred)} of ${fmt.bytes(s.totalBytes)}`; },
          err => { txt.innerHTML = `<span style="color:var(--bad)">Upload failed: ${esc(err.code)}</span>`; },
          async () => { const url = await getDownloadURL(task.snapshot.ref);
                        dr.dataset.fileUrl = url;
                        txt.innerHTML = `<span style="color:var(--ok)">Uploaded ${esc(f.name)}</span>`; });
      }

      $('#bf-save').onclick = async () => {
        const id = $('#bf-id').value.trim();
        const name = $('#bf-name').value.trim();
        if (!name) return toast('Book name is required', 'bad');
        if (!id) return toast('Book ID is required', 'bad');
        if (isNew && books.some(x => x.id === id)) return toast('That book ID already exists', 'bad');

        const data = {
          name, description: $('#bf-desc').value.trim(),
          subjects: $('#bf-sub').value.split(',').map(s => s.trim()).filter(Boolean),
          exams: $('#bf-exam').value.split(',').map(s => s.trim()).filter(Boolean),
          tier: $('#bf-tier').value,
          questionCount: +$('#bf-count').value || 0,
          family: $('#bf-fam').value,
          source: $('#bf-src').value,
          active: b.active ?? false
        };
        if (dr.dataset.fileUrl) data.fileUrl = dr.dataset.fileUrl;
        await db.set('books', id, data);
        await db.audit(isNew ? 'book.create' : 'book.update', id);
        if (isNew) books.push({ id, ...data }); else Object.assign(b, data);
        toast(isNew ? 'Book created' : 'Changes saved');
        closeDrawer(); refresh();
      };

      const del = $('#bf-del');
      if (del) del.onclick = async () => {
        const ok = await confirmTyped({
          title: 'Delete ' + b.name + '?',
          body: `This removes the catalog entry and its Storage files. Students who already
                 imported this pack keep their local copy — their history is not touched.`,
          word: 'DELETE'
        });
        if (!ok) return;
        await db.del('books', b.id);
        await db.audit('book.delete', b.id);
        const i = books.findIndex(x => x.id === b.id); if (i >= 0) books.splice(i, 1);
        toast('Book deleted'); closeDrawer(); refresh();
      };

      $$('[data-x]', dr).forEach(x => x.onclick = closeDrawer);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   SECTION 4 — PRICING

route('pricing', async host => {
  const cfg = await db.get('config', 'pricing') || { plans: [] };
  const plans = [...(cfg.plans || [])].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  const previewCard = p => `
    <div style="border:1px solid ${p.badge ? 'color-mix(in srgb,var(--c2) 46%,transparent)' : 'var(--line)'};
      border-radius:16px;padding:16px;position:relative;
      background:linear-gradient(165deg,rgba(24,22,48,.72),rgba(10,10,24,.82))">
      ${p.badge ? `<span class="tag" style="position:absolute;top:-9px;left:14px;
        background:linear-gradient(100deg,var(--c1),var(--c2));color:#fff;border:0">${esc(p.badge)}</span>` : ''}
      <b style="font-size:14px">${esc(p.name)}</b>
      <div style="margin:9px 0 4px;font-family:var(--mono);font-size:24px;font-weight:600">
        ${p.price ? '₹' + p.price : 'Free'}
        <span style="font-size:11px;color:var(--tx-3);font-family:var(--font)">
          ${p.price ? '/' + (p.interval || 'month') : ''}</span></div>
      <div style="display:grid;gap:5px;margin-top:11px">
        ${(p.features || []).map(f => `<div style="display:flex;gap:7px;font-size:11.5px;color:var(--tx-2)">
          <span style="color:var(--ok)">${ico('check', 13)}</span><span>${esc(f)}</span></div>`).join('')}
      </div>
    </div>`;

  host.innerHTML = `
    <div class="page-h">
      <div><h1>Plans &amp; pricing</h1>
        <p>Edits publish to <b class="mono">/config/pricing</b> and reach clients within
           the 5-minute config TTL, or instantly via <em>Force refresh</em> in Settings.</p></div>
      <div class="acts"><button class="btn btn-p" id="pr-add">${ico('plus', 15)} Add plan</button></div>
    </div>
    <div class="grid g-2">
      <section class="card">
        <div class="card-h"><div><h2>Plans</h2><p>Drag the handle to reorder</p></div></div>
        <div id="pr-list"></div>
      </section>
      <section class="card">
        <div class="card-h"><div><h2>Live preview</h2><p>As students will see it</p></div></div>
        <div class="card-b"><div class="grid" style="gap:11px" id="pr-prev"></div></div>
      </section>
    </div>
    <section class="card" style="margin-top:14px">
      <div class="card-h"><div><h2>Change history</h2><p>Every pricing edit is recorded</p></div></div>
      <div id="pr-hist"></div>
    </section>`;

  const draw = () => {
    $('#pr-list').innerHTML = plans.map((p, i) => `
      <div class="row" draggable="true" data-i="${i}">
        <span style="cursor:grab;color:var(--tx-3)" aria-hidden="true">${ico('menu', 15)}</span>
        <div class="row-t">
          <b>${esc(p.name)} ${p.archived ? '<span class="tag">archived</span>' : ''}</b>
          <small class="mono">${p.price ? '₹' + p.price + ' / ' + (p.interval || 'month') : 'Free'}
            ${p.stripePriceId ? ' · ' + esc(p.stripePriceId) : ''}</small>
        </div>
        <button class="btn btn-g btn-sm" data-edit="${i}">Edit</button>
      </div>`).join('') || `<div class="empty">${ico('tag', 34)}<h3>No plans yet</h3>
        <p>Add your first plan to control what students see on the upgrade screen.</p></div>`;
    $('#pr-prev').innerHTML = plans.filter(p => !p.archived).map(previewCard).join('');
  };
  draw();

  db.list('auditLog').then(log => {
    const rows = log.filter(a => a.action?.startsWith('pricing'));
    $('#pr-hist').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th></tr></thead>
      <tbody>${rows.map(a => `<tr><td>${fmt.dt(a.at)}</td><td>${esc(a.adminEmail || a.adminUid)}</td>
        <td><span class="tag">${esc(a.action)}</span></td><td class="mono">${esc(a.target)}</td></tr>`).join('')}
      </tbody></table></div>`
      : `<div class="empty" style="padding:28px">${ico('file', 30)}<h3>No pricing changes yet</h3>
         <p>Every edit will be logged here with who made it and when.</p></div>`;
  });

  const save = async () => {
    plans.forEach((p, i) => p.order = i);
    await db.set('config', 'pricing', { plans });
    await db.audit('pricing.update', 'config/pricing');
    draw(); toast('Pricing published');
  };

  /* Drag to reorder. Plain HTML5 DnD — no library, keyboard fallback via Edit. */
  let dragFrom = null;
  $('#pr-list').addEventListener('dragstart', e => {
    dragFrom = +e.target.closest('[data-i]').dataset.i;
    e.target.style.opacity = '.4';
  });
  $('#pr-list').addEventListener('dragend', e => { e.target.style.opacity = ''; });
  $('#pr-list').addEventListener('dragover', e => e.preventDefault());
  $('#pr-list').addEventListener('drop', async e => {
    e.preventDefault();
    const to = +e.target.closest('[data-i]')?.dataset.i;
    if (dragFrom == null || to == null || dragFrom === to) return;
    plans.splice(to, 0, plans.splice(dragFrom, 1)[0]);
    await save();
  });

  $('#pr-list').addEventListener('click', e => {
    const b = e.target.closest('[data-edit]');
    if (b) editPlan(plans[+b.dataset.edit], plans, save);
  });
  $('#pr-add').onclick = () => editPlan(null, plans, save);
});

function editPlan(plan, plans, save) {
  const isNew = !plan;
  const p = plan || { id: '', name: '', price: 0, interval: 'month', features: [], badge: '', archived: false };
  drawer({
    title: isNew ? 'Add plan' : 'Edit ' + p.name,
    body: `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
        <div class="field"><label for="pf-name">Plan name</label>
          <input id="pf-name" value="${esc(p.name)}" placeholder="Blaze"></div>
        <div class="field"><label for="pf-id">Plan ID</label>
          <input id="pf-id" class="mono" value="${esc(p.id)}" ${isNew ? '' : 'readonly'} placeholder="blaze"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
        <div class="field"><label for="pf-price">Price (₹)</label>
          <input id="pf-price" type="number" min="0" class="mono" value="${p.price || 0}"></div>
        <div class="field"><label for="pf-int">Billing interval</label>
          <select id="pf-int">${['month', 'year', 'forever'].map(v =>
            `<option ${p.interval === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="pf-badge">Badge (optional)</label>
        <input id="pf-badge" value="${esc(p.badge || '')}" placeholder="Most Popular"></div>
      <div class="field"><label for="pf-stripe">Stripe price ID</label>
        <input id="pf-stripe" class="mono" value="${esc(p.stripePriceId || '')}" placeholder="price_…">
        <span class="hint">From your Stripe dashboard. Leave blank for free plans.</span></div>
      <div class="field"><label for="pf-feat">Features — one per line</label>
        <textarea id="pf-feat" rows="6">${esc((p.features || []).join('\n'))}</textarea></div>
      ${isNew ? '' : `<div class="note warn">${ico('info', 14)}<span>Plans are <b>archived</b>,
        never hard-deleted, so existing subscribers are never orphaned.</span></div>
        <button class="btn btn-g btn-full" id="pf-arch" style="margin-top:9px">
          ${p.archived ? 'Restore plan' : 'Archive plan'}</button>`}`,
    footer: `<button class="btn btn-g" data-x>Cancel</button>
             <button class="btn btn-p" id="pf-save">${isNew ? 'Create' : 'Save'}</button>`,
    onMount(dr) {
      if (isNew) $('#pf-name').addEventListener('input', e => {
        $('#pf-id').value = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      });
      $('#pf-save').onclick = async () => {
        const name = $('#pf-name').value.trim(), id = $('#pf-id').value.trim();
        if (!name || !id) return toast('Name and ID are required', 'bad');
        const data = { id, name, price: +$('#pf-price').value || 0,
          interval: $('#pf-int').value, badge: $('#pf-badge').value.trim(),
          stripePriceId: $('#pf-stripe').value.trim(),
          features: $('#pf-feat').value.split('\n').map(s => s.trim()).filter(Boolean),
          archived: p.archived || false };
        if (isNew) plans.push(data); else Object.assign(p, data);
        closeDrawer(); await save();
      };
      const a = $('#pf-arch');
      if (a) a.onclick = async () => { p.archived = !p.archived; closeDrawer(); await save(); };
      $$('[data-x]', dr).forEach(x => x.onclick = closeDrawer);
    }
  });
}

/* ═══ SECTION 6 — USERS ═══════════════════════════════════════════════ */
route('users', async host => {
  const users = await db.list('users');
  let page = 0, per = 25, q = '', planF = 'all';

  const rows = () => users.filter(u =>
    (planF === 'all' || u.plan === planF) &&
    (!q || (u.profile?.displayName + ' ' + u.profile?.email).toLowerCase().includes(q)));

  const draw = () => {
    const all = rows();
    const slice = all.slice(page * per, page * per + per);
    $('#us-body').innerHTML = slice.length ? slice.map(u => `
      <tr data-uid="${esc(u.uid)}" style="cursor:pointer">
        <td><div style="display:flex;align-items:center;gap:9px">
          <span class="side-ava" style="width:26px;height:26px;font-size:11px">${esc((u.profile?.displayName || 'L')[0])}</span>
          <div><b>${esc(u.profile?.displayName || 'Learner')}</b>
            <div style="font-size:10.5px;color:var(--tx-3)">${esc(u.profile?.email || '—')}</div></div>
        </div></td>
        <td><span class="tag ${u.plan === 'spark' ? '' : u.plan === 'blaze' ? 'c5' : 'warn'}">${esc(u.plan)}</span></td>
        <td class="num">${fmt.n(u.progress?.rankedXp)}</td>
        <td class="num">Lv ${u.progress?.level ?? 1}</td>
        <td class="num">${(u.progress?.accuracy ?? 0).toFixed(0)}%</td>
        <td>${fmt.ago(u.lastActive)}</td>
        <td><span class="tag ${u.status === 'active' ? 'ok' : 'bad'}">${esc(u.status)}</span></td>
      </tr>`).join('')
      : `<tr><td colspan="7"><div class="empty">${ico('users', 30)}<h3>No users match</h3>
         <p>Try a different search or plan filter.</p></div></td></tr>`;
    $('#us-info').textContent = all.length
      ? `${page * per + 1}–${Math.min(all.length, page * per + per)} of ${fmt.n(all.length)}` : '0';
    $('#us-prev').disabled = page === 0;
    $('#us-next').disabled = (page + 1) * per >= all.length;
  };

  host.innerHTML = `
    <div class="page-h">
      <div><h1>Users</h1><p>Mirrored from <b class="mono">/users/{uid}</b>. Destructive
        actions require typed confirmation and are written to the audit log.</p></div>
      <div class="acts"><button class="btn btn-g" id="us-csv">${ico('dl', 15)} Export</button></div>
    </div>
    <div class="card">
      <div class="card-b" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;
        border-bottom:1px solid var(--line)">
        <div class="search" style="flex:1;min-width:200px">${ico('search', 15)}
          <input id="us-q" placeholder="Search name or email…" aria-label="Search users"></div>
        <select class="btn btn-g" id="us-plan" aria-label="Plan">
          <option value="all">All plans</option><option value="spark">Spark</option>
          <option value="blaze">Blaze</option><option value="inferno">Inferno</option></select>
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>User</th><th>Plan</th><th class="num">Ranked XP</th><th class="num">Level</th>
          <th class="num">Accuracy</th><th>Last active</th><th>Status</th></tr></thead>
        <tbody id="us-body"></tbody></table></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 15px;
        border-top:1px solid var(--line)">
        <span class="mono" style="font-size:11.5px;color:var(--tx-3)" id="us-info"></span>
        <div style="display:flex;gap:7px">
          <button class="btn btn-g btn-sm" id="us-prev">Previous</button>
          <button class="btn btn-g btn-sm" id="us-next">Next</button></div>
      </div>
    </div>`;
  draw();
  $('#us-q').oninput = e => { q = e.target.value.toLowerCase().trim(); page = 0; draw(); };
  $('#us-plan').onchange = e => { planF = e.target.value; page = 0; draw(); };
  $('#us-prev').onclick = () => { if (page > 0) { page--; draw(); } };
  $('#us-next').onclick = () => { page++; draw(); };
  $('#us-csv').onclick = () => csv(rows().map(u => ({
    uid: u.uid, name: u.profile?.displayName, email: u.profile?.email, plan: u.plan,
    status: u.status, xp: u.progress?.totalXp, level: u.progress?.level
  })), 'rankspark-users');

  $('#us-body').addEventListener('click', e => {
    const tr = e.target.closest('[data-uid]');
    if (tr) userDrawer(users.find(u => u.uid === tr.dataset.uid), draw);
  });
});

      <div class="field"><label for="ud-note">Support notes (admin only)</label>

      <div class="field"><label for="ud-plan">Override plan</label>
        <select id="ud-plan">${['spark', 'blaze', 'inferno'].map(v =>
          `<option value="${v}" ${u.plan === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <span class="hint">Grants access without a Stripe payment. Use for support cases only.</span></div>
      <div class="note warn" style="margin-top:16px">${ico('warn', 14)}<span>

      <div style="display:grid;gap:8px;margin-top:11px">
        <button class="btn btn-g" id="ud-reset">Send password reset email</button>
        <button class="btn btn-g" id="ud-signout">Force sign-out (invalidate sessions)</button>
        <button class="btn btn-d" id="ud-progress">Reset all progress</button>
        <button class="btn btn-d" id="ud-susp">${u.status === 'active' ? 'Suspend account' : 'Reinstate account'}</button>
      </div>`,
    footer: `<button class="btn btn-g" data-x>Close</button>
             <button class="btn btn-p" id="ud-save">Save changes</button>`,
    onMount(dr) {
      $('#ud-save').onclick = async () => {
        u.supportNote = $('#ud-note').value.trim();
        const np = $('#ud-plan').value;
        if (np !== u.plan) { await db.audit('user.plan_override', u.uid, `${u.plan} → ${np}`); u.plan = np; }
        await db.set('users', u.uid, { supportNote: u.supportNote, plan: u.plan });
        toast('User updated'); closeDrawer(); refresh();
      };
      $('#ud-reset').onclick = async () => {
        if (state.live) {
          const { sendPasswordResetEmail } = state.fb.mods.auth;
          try { await sendPasswordResetEmail(state.fb.auth, u.profile.email); }
          catch (e) { return toast(e.code || 'Failed', 'bad'); }
        }
        await db.audit('user.password_reset', u.uid);
        toast('Reset email sent to ' + u.profile.email);
      };
      $('#ud-signout').onclick = async () => {
        await db.set('users', u.uid, { sessionEpoch: Date.now() });
        await db.audit('user.force_signout', u.uid);
        toast('Sessions invalidated — the client signs out on next config check');
      };
      $('#ud-progress').onclick = async () => {
        if (!await confirmTyped({ title: 'Reset progress?',
          body: `Clears XP, streak, history and analytics for
                 <b>${esc(u.profile?.displayName)}</b>. Bookmarks and notes are kept.
                 This cannot be undone.`, word: 'RESET' })) return;
        await db.set('users', u.uid, { progress: { totalXp: 0, rankedXp: 0, level: 1, streak: 0, totalTests: 0 } });
        await db.audit('user.reset_progress', u.uid);
        u.progress = { totalXp: 0, rankedXp: 0, level: 1, streak: 0, totalTests: 0 };
        toast('Progress reset'); closeDrawer(); refresh();
      };
      $('#ud-susp').onclick = async () => {
        const next = u.status === 'active' ? 'suspended' : 'active';
        if (next === 'suspended' && !await confirmTyped({ title: 'Suspend account?',
          body: `<b>${esc(u.profile?.displayName)}</b> will be signed out and blocked
                 from signing in. Their data is preserved.`, word: 'SUSPEND' })) return;
        u.status = next;
        await db.set('users', u.uid, { status: next });
        await db.audit('user.' + (next === 'suspended' ? 'suspend' : 'reinstate'), u.uid);
        toast('Account ' + next); closeDrawer(); refresh();
      };
      $$('[data-x]', dr).forEach(x => x.onclick = closeDrawer);
    }
  });
}

route('live', async host => {
  const draw = async () => {
    const s = await db.list('sessions');
    const byView = {};
    s.forEach(x => byView[x.view] = (byView[x.view] || 0) + 1);
    $('#lv-count').textContent = s.length;
    $('#lv-body').innerHTML = s.length ? s.map(x => `
      <tr><td><div style="display:flex;align-items:center;gap:9px">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--ok);
          box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)"></span>
        <b>${esc(x.name || 'Guest')}</b></div></td>
        <td><span class="tag c5">${esc(x.view)}</span></td>
        <td>${esc(x.device)}</td>
        <td class="mono">${Math.round((Date.now() - x.startedAt) / 60000)}m</td>
        <td>${fmt.ago(x.lastSeen)}</td></tr>`).join('')
      : `<tr><td colspan="5"><div class="empty">${ico('radio', 30)}<h3>Nobody online right now</h3>
         <p>Sessions appear here within 30 seconds of a student opening the app —
            once presence tracking is enabled in Settings.</p></div></td></tr>`;
    $('#lv-views').innerHTML = Object.entries(byView).sort((a, b) => b[1] - a[1]).map(([v, n]) => `
      <div class="bar-row"><div>
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span>${esc(v)}</span><b class="mono" style="color:var(--tx)">${n}</b></div>
        <div class="bar"><i style="width:${(n / s.length) * 100}%"></i></div>
      </div><span class="mono" style="text-align:right;color:var(--tx-3)">${
        ((n / s.length) * 100).toFixed(0)}%</span></div>`).join('') || '';
  };

  host.innerHTML = `
    <div class="page-h">
      <div><h1>Live activity</h1><p>Real-time presence from
        <b class="mono">/sessions</b>, refreshed automatically.</p></div>
      <div class="acts"><span class="tag ok"><i style="width:6px;height:6px;border-radius:50%;
        background:currentColor;display:inline-block"></i> <span id="lv-count">0</span> online</span></div>
    </div>
    <div class="note warn" style="margin-bottom:14px">${ico('info', 14)}<span>
      <b>Cost note.</b> A 30-second heartbeat per active user is roughly
      <b class="mono">2 writes/min/user</b> — about 86k writes/day at 1,000 concurrent users.
      That is the single most expensive pattern in this design. For scale, move presence to
      <b>Realtime Database</b> (priced on bandwidth, with native <b class="mono">onDisconnect</b>)
      or sample 1-in-N users. Presence is therefore <b>off by default</b> — enable it in Settings.</span></div>
    <div class="grid g-2">
      <section class="card">
        <div class="card-h"><div><h2>Who is online</h2><p>Updates without a refresh</p></div></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>User</th><th>Screen</th><th>Device</th><th>Session</th><th>Last seen</th></tr></thead>
          <tbody id="lv-body"></tbody></table></div>
      </section>
      <section class="card">
        <div class="card-h"><div><h2>Where they are</h2><p>Distribution by screen</p></div></div>
        <div class="card-b" id="lv-views"></div>
      </section>
    </div>`;
  await draw();

  if (state.live) {
    const { collection, onSnapshot, query, where } = state.fb.mods.fs;
    const cutoff = new Date(Date.now() - 120000);
    const unsub = onSnapshot(query(collection(state.fb.db, 'sessions'),
      where('lastSeen', '>', cutoff)), draw);
    host.addEventListener('rs-leave', unsub, { once: true });
  } else {
    const iv = setInterval(draw, 5000);
    host.addEventListener('rs-leave', () => clearInterval(iv), { once: true });
  }
});

            <textarea id="mt-msg" rows="3"
              placeholder="We are upgrading the question engine. Back shortly.">${esc(m.message || '')}</textarea></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
            <div class="field"><label for="mt-s">Scheduled start</label>
              <input id="mt-s" type="datetime-local" value="${m.scheduledStart ? String(m.scheduledStart).slice(0, 16) : ''}"></div>
            <div class="field"><label for="mt-e">Scheduled end</label>
              <input id="mt-e" type="datetime-local" value="${m.scheduledEnd ? String(m.scheduledEnd).slice(0, 16) : ''}">
              <span class="hint">Shown to users as a live countdown</span></div>
          </div>
          <div class="field"><label for="mt-uid">Bypass allowlist (uids)</label>
            <textarea id="mt-uid" rows="2" class="mono"
              placeholder="One uid per line">${esc((m.allowedUids || []).join('\n'))}</textarea>
            <span class="hint">These accounts keep full access so QA can verify a release.</span></div>
          <button class="btn btn-p btn-full" id="mt-save">Save maintenance settings</button>
        </div>
      </section>
      <section class="card">
        <div class="card-h"><div><h2>What users will see</h2><p>Exact on-brand screen</p></div></div>
        <div class="card-b">
          <div style="border-radius:16px;padding:26px 20px;text-align:center;
            border:1px solid var(--line);
            background:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(109,92,255,.2),transparent 62%),#0a0a16">
            <span class="tag warn" style="margin-bottom:14px">Scheduled maintenance</span>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px">We are making RankSpark better</div>
            <div id="mt-prev" style="font-size:12.5px;color:var(--tx-2);line-height:1.6"></div>
            <div class="mono" style="margin-top:16px;padding:10px;border-radius:11px;
              border:1px solid var(--line);color:var(--c5);font-size:13px">Back in 1h 29m 58s</div>
          </div>
          <div class="note" style="margin-top:13px">${ico('info', 14)}<span>
            This is a full-screen takeover inside the app, not a browser alert. The
            countdown is live and the screen re-checks config automatically.</span></div>
        </div>
      </section>
    </div>`;

  const sync = () => $('#mt-prev').textContent = $('#mt-msg').value ||
    'RankSpark is briefly offline for maintenance. Your progress is safe — nothing has been lost.';
  $('#mt-msg').oninput = sync; sync();

  $('#mt-tg').onclick = async () => {
    const next = $('#mt-tg').getAttribute('aria-checked') !== 'true';
    if (next && !await confirmTyped({
      title: 'Take RankSpark offline?',
      body: `Every student who is not on the bypass allowlist will immediately see the
             maintenance screen instead of the app. Nothing is deleted, but nobody can
             practise until you turn this off.`,
      word: 'MAINTENANCE'
    })) return;
    $('#mt-tg').setAttribute('aria-checked', String(next));
    $('#mt-state').textContent = next ? 'App is DOWN' : 'App is live';
    $('#mt-state').className = 'tag ' + (next ? 'bad' : 'ok');
    await db.set('config', 'app', { maintenance: { ...m, enabled: next } });
    await db.audit('maintenance.' + (next ? 'enable' : 'disable'), 'config/app');
    toast(next ? 'Maintenance mode ON — app is offline' : 'Maintenance mode off', next ? 'bad' : 'ok');
  };

  $('#mt-save').onclick = async () => {
    const data = {
      enabled: $('#mt-tg').getAttribute('aria-checked') === 'true',
      message: $('#mt-msg').value.trim(),
      scheduledStart: $('#mt-s').value || null,
      scheduledEnd: $('#mt-e').value || null,
      allowedUids: $('#mt-uid').value.split('\n').map(s => s.trim()).filter(Boolean)
    };
    await db.set('config', 'app', { maintenance: data });
    await db.audit('maintenance.update', 'config/app');
    toast('Maintenance settings saved');
  };
});

route('payments', async host => {
  const pays = await db.list('payments');
  const total = pays.filter(p => p.status === 'paid').reduce((t, p) => t + p.amount, 0);
  const refunded = pays.filter(p => p.status === 'refunded').reduce((t, p) => t + p.amount, 0);
  const failed = pays.filter(p => p.status === 'failed').length;

  host.innerHTML = `
    <div class="page-h">
      <div><h1>Payments</h1><p>Mirror of Stripe, kept in sync by the webhook Cloud Function.
        Refunds run server-side — the browser never holds a Stripe secret.</p></div>
      <div class="acts"><button class="btn btn-g" id="pm-csv">${ico('dl', 15)} Export</button></div>
    </div>
    <div class="grid g-kpi" style="margin-bottom:14px">
      <div class="kpi" style="--k:var(--ok)"><div class="kpi-t">${ico('card', 14)}Collected</div>
        <div class="kpi-v">${fmt.money(total)}</div><div class="kpi-d">all time</div></div>
      <div class="kpi" style="--k:var(--warn)"><div class="kpi-t">${ico('refresh', 14)}Refunded</div>
        <div class="kpi-v">${fmt.money(refunded)}</div><div class="kpi-d">all time</div></div>
      <div class="kpi" style="--k:var(--bad)"><div class="kpi-t">${ico('warn', 14)}Failed</div>
        <div class="kpi-v">${fmt.n(failed)}</div><div class="kpi-d">needs retry</div></div>
      <div class="kpi" style="--k:var(--c1)"><div class="kpi-t">${ico('chart', 14)}Avg order</div>
        <div class="kpi-v">${fmt.money(Math.round(total / Math.max(1, pays.filter(p => p.status === 'paid').length)))}</div>
        <div class="kpi-d">per paid transaction</div></div>
    </div>
    <div class="card">
      <div class="card-h"><div><h2>Transactions</h2><p>Newest first</p></div></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Customer</th><th>Plan</th><th class="num">Amount</th>
          <th>Status</th><th>Date</th><th></th></tr></thead>
        <tbody>${pays.length ? pays.map(p => `<tr>
          <td><b>${esc(p.customer)}</b><div class="mono" style="font-size:10px;color:var(--tx-3)">${esc(p.id)}</div></td>
          <td>${esc(p.plan)}</td><td class="num">${fmt.money(p.amount)}</td>
          <td><span class="tag ${p.status === 'paid' ? 'ok' : p.status === 'refunded' ? 'warn' : 'bad'}">${esc(p.status)}</span></td>
          <td>${fmt.date(p.createdAt)}</td>
          <td style="text-align:right">${p.status === 'paid'
            ? `<button class="btn btn-g btn-sm" data-rf="${esc(p.id)}">Refund</button>` : ''}</td>
        </tr>`).join('') : `<tr><td colspan="6"><div class="empty">${ico('card', 30)}
          <h3>No transactions yet</h3><p>Payments appear here once the Stripe webhook
          is deployed and your first checkout completes.</p></div></td></tr>`}</tbody></table></div>
    </div>`;

  $('#pm-csv').onclick = () => csv(pays, 'rankspark-payments');
  host.addEventListener('click', async e => {
    const b = e.target.closest('[data-rf]');
    if (!b) return;
    const p = pays.find(x => x.id === b.dataset.rf);
    if (!await confirmTyped({ title: 'Refund ' + fmt.money(p.amount) + '?',
      body: `Refunds <b>${esc(p.customer)}</b> in full via Stripe and downgrades their plan
             at period end. This calls a Cloud Function — it cannot be undone from here.`,
      word: 'REFUND' })) return;
    p.status = 'refunded';
    await db.set('payments', p.id, { status: 'refunded' });
    await db.audit('payment.refund', p.id, fmt.money(p.amount));
    toast('Refund issued'); Promise.resolve({go:go}).then(m => m.go('payments'));
  });
});

route('settings', async host => {
  const cfg = await db.get('config', 'app') || {};
  const flags = cfg.featureFlags || {};
  const admins = await db.list('admins');
  const log = await db.list('auditLog');
  const live = state.live;

  const FLAGS = [
    ['leaderboard', 'Leaderboard', 'Show the leaderboard nav and page'],
    ['rankedSubmissions', 'Ranked submissions', 'Allow mock results to affect global rank'],
    ['paperLab', 'Paper Lab', 'Printable paper generator'],
    ['cloudSync', 'Cloud sync', 'Mirror progress to Firestore'],
    ['presence', 'Presence tracking', 'Powers Live Users — see the cost note there']
  ];

  host.innerHTML = `
    <div class="page-h"><div><h1>Settings</h1>
      <p>Feature flags, admin access and system health.</p></div>
      <div class="acts"><button class="btn btn-g" id="st-bump">${ico('refresh', 15)} Force refresh all clients</button></div></div>

    <div class="grid g-2">
      <section class="card">
        <div class="card-h"><div><h2>Feature flags</h2>
          <p>Toggle features remotely — clients pick changes up within 5 minutes</p></div></div>
        ${FLAGS.map(([k, t, d]) => `<div class="row">
          <div class="row-t"><b>${t}</b><small>${d}</small></div>
          <button class="toggle" data-flag="${k}" role="switch"
            aria-checked="${flags[k] !== false && flags[k] !== undefined ? !!flags[k] : k !== 'presence'}"
            aria-label="${t}"></button></div>`).join('')}
        <div class="card-b" style="border-top:1px solid var(--line)">
          <div class="field"><label for="st-ver">Minimum supported app version</label>
            <input id="st-ver" type="number" class="mono" value="${cfg.minAppVersion || 0}">
            <span class="hint">Older clients see a forced-update screen. 0 disables the check.</span></div>
        </div>
      </section>

      <section class="card">
        <div class="card-h"><div><h2>System status</h2><p>Check before assuming the app is broken</p></div></div>
        <div class="card-b" id="st-health"></div>
      </section>
    </div>

    <section class="card" style="margin-top:14px">
      <div class="card-h"><div><h2>Firebase connection</h2>
        <p>${live ? 'Connected to a live project' : 'Not connected — the app is running on demo data'}</p></div>
        <span class="tag ${live ? 'ok' : 'warn'}">${live ? 'Live' : 'Demo'}</span></div>
      <div class="card-b">
        <div class="field"><label for="st-cfg">Firebase web config (JSON)</label>
          <textarea id="st-cfg" rows="7" class="mono" style="font-size:11.5px"
            placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","storageBucket":"…","appId":"…"}'>${
            esc(storedConfig() ? JSON.stringify(storedConfig(), null, 2) : '')}</textarea>
          <span class="hint">Paste the config object from Firebase console → Project settings →
            Your apps. Stored in this browser only; never committed to the repo.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-p" id="st-connect">Connect project</button>
          ${live ? '<button class="btn btn-g" id="st-disc">Disconnect</button>' : ''}
        </div>
      </div>
    </section>

    <div class="grid g-2" style="margin-top:14px">
      <section class="card">
        <div class="card-h"><div><h2>Admin access</h2><p>Who can open this dashboard</p></div>
          <button class="btn btn-g btn-sm" id="st-inv">${ico('plus', 14)} Invite</button></div>
        ${admins.length ? admins.map(a => `<div class="row">
          <span class="side-ava" style="width:28px;height:28px;font-size:11px">${esc((a.email || 'A')[0].toUpperCase())}</span>
          <div class="row-t"><b>${esc(a.email || a.id)}</b><small class="mono">${esc(a.id)}</small></div>
          <span class="tag ${a.role === 'owner' ? 'c5' : ''}">${esc(a.role || 'admin')}</span>
          ${a.role === 'owner' ? '' : `<button class="btn btn-g btn-sm" data-rv="${esc(a.id)}">Revoke</button>`}
        </div>`).join('') : `<div class="empty" style="padding:28px">${ico('users', 30)}
          <h3>No admins yet</h3><p>Add a uid to <b class="mono">/admins</b> to grant access.</p></div>`}
      </section>

      <section class="card">
        <div class="card-h"><div><h2>Audit log</h2><p>Every privileged action</p></div>
          <button class="btn btn-g btn-sm" id="st-log-csv">${ico('dl', 14)} Export</button></div>
        <div class="tbl-wrap" style="max-height:300px"><table class="tbl">
          <thead><tr><th>Action</th><th>Target</th><th>When</th></tr></thead>
          <tbody>${log.length ? log.slice(0, 40).map(a => `<tr>
            <td><span class="tag">${esc(a.action)}</span></td>
            <td class="mono" style="font-size:11px">${esc(a.target)}</td>
            <td>${fmt.ago(a.at)}</td></tr>`).join('')
            : `<tr><td colspan="3"><div class="empty" style="padding:24px">
               ${ico('file', 28)}<h3>Nothing logged yet</h3></div></td></tr>`}</tbody></table></div>
      </section>
    </div>`;

  /* Live health probes rather than static green dots. */
  (async () => {
    const probe = async (label, fn) => {
      const t0 = performance.now();
      try { await fn(); return { label, ok: true, ms: Math.round(performance.now() - t0) }; }
      catch (e) { return { label, ok: false, ms: Math.round(performance.now() - t0), err: e.code || e.message }; }
    };
    const results = await Promise.all([
      probe('Firestore read', () => db.get('config', 'app')),
      probe('Auth session', async () => { if (live && !state.fb.auth.currentUser) throw new Error('no session'); }),
      probe('Storage bucket', async () => { if (!live) return; if (!state.fb.storage) throw new Error('unavailable'); })
    ]);
    $('#st-health').innerHTML = results.map(r => `
      <div style="display:flex;align-items:center;gap:10px;padding:9px 0;
        border-bottom:1px solid var(--line)">
        <span style="width:8px;height:8px;border-radius:50%;
          background:${r.ok ? 'var(--ok)' : 'var(--bad)'};
          box-shadow:0 0 0 3px color-mix(in srgb,${r.ok ? 'var(--ok)' : 'var(--bad)'} 20%,transparent)"></span>
        <span style="flex:1;font-size:12.5px">${r.label}</span>
        <span class="mono" style="font-size:11px;color:var(--tx-3)">${r.ok ? r.ms + 'ms' : esc(r.err || 'failed')}</span>
      </div>`).join('') +
      `<div class="note" style="margin-top:12px">${ico('info', 14)}<span>Config version
        <b class="mono">${cfg.configVersion ?? 0}</b>. Clients cache for 5 minutes;
        bump the version to force an early refresh.</span></div>`;
  })();

  host.addEventListener('click', async e => {
    const f = e.target.closest('[data-flag]');
    if (f) {
      const k = f.dataset.flag;
      const next = f.getAttribute('aria-checked') !== 'true';
      if (k === 'presence' && next && !await confirmTyped({
        title: 'Enable presence tracking?',
        body: `This makes every active client write a heartbeat every 30 seconds —
               roughly <b class="mono">86,000 writes/day at 1,000 concurrent users</b>.
               Enable it deliberately, not by default.`, word: 'ENABLE', danger: false })) return;
      f.setAttribute('aria-checked', String(next));
      flags[k] = next;
      await db.set('config', 'app', { featureFlags: flags });
      await db.audit('flag.' + k, String(next));
      toast(k + ' ' + (next ? 'enabled' : 'disabled'));
      return;
    }
    const rv = e.target.closest('[data-rv]');
    if (rv) {
      if (!await confirmTyped({ title: 'Revoke admin access?',
        body: `This account will immediately lose access to the dashboard.`, word: 'REVOKE' })) return;
      await db.del('admins', rv.dataset.rv);
      await db.audit('admin.revoke', rv.dataset.rv);
      toast('Access revoked'); Promise.resolve({go:go}).then(m => m.go('settings'));
    }
  });

  $('#st-bump').onclick = async () => {
    await db.set('config', 'app', { configVersion: (cfg.configVersion || 0) + 1 });
    await db.audit('config.force_refresh', 'config/app');
    toast('Version bumped — clients refresh on next check');
  };
  $('#st-ver').onchange = async e => {
    await db.set('config', 'app', { minAppVersion: +e.target.value || 0 });
    toast('Minimum version saved');
  };
  $('#st-log-csv').onclick = () => csv(log, 'rankspark-audit-log');
  $('#st-inv').onclick = () => drawer({
    title: 'Invite an admin',
    body: `<div class="field"><label for="iv-uid">Firebase uid</label>
        <input id="iv-uid" class="mono" placeholder="The uid from Firebase Auth">
        <span class="hint">Find it in Firebase console → Authentication → Users.</span></div>
      <div class="field"><label for="iv-em">Email (for display)</label>
        <input id="iv-em" type="email" placeholder="colleague@rankspark.app"></div>
      <div class="note warn">${ico('warn', 14)}<span>Admins can change pricing, take the app
        offline and delete user data. Grant sparingly.</span></div>`,
    footer: `<button class="btn btn-g" data-x>Cancel</button>
             <button class="btn btn-p" id="iv-go">Grant access</button>`,
    onMount(dr) {
      $('#iv-go').onclick = async () => {
        const uid = $('#iv-uid').value.trim();
        if (!uid) return toast('uid is required', 'bad');
        await db.set('admins', uid, { email: $('#iv-em').value.trim(), role: 'admin',
          addedAt: new Date().toISOString(), addedBy: state.user?.uid || 'demo-admin' });
        await db.audit('admin.invite', uid);
        toast('Admin added'); closeDrawer(); Promise.resolve({go:go}).then(m => m.go('settings'));
      };
      $$('[data-x]', dr).forEach(x => x.onclick = closeDrawer);
    }
  });

  $('#st-connect').onclick = async () => {
    let cfgObj;
    try { cfgObj = JSON.parse($('#st-cfg').value); }
    catch { return toast('That is not valid JSON', 'bad'); }
    if (!cfgObj.apiKey || !cfgObj.projectId) return toast('Missing apiKey or projectId', 'bad');
    saveConfig(cfgObj);
    toast('Config saved — reloading');
    setTimeout(() => location.reload(), 700);
  };
  const dc = $('#st-disc');
  if (dc) dc.onclick = async () => {
    if (!await confirmTyped({ title: 'Disconnect Firebase?',
      body: 'The dashboard returns to demo data. Your Firestore data is untouched.',
      word: 'DISCONNECT' })) return;
    clearConfig(); location.reload();
  };
});
