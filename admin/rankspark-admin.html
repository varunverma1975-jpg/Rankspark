    ['payments', 'Payments', 'card']
  ]],
  ['People', [
    ['users', 'Users', 'users'],
    ['email', 'Email', 'mail']
  ]],
  ['Comms', [
    ['notifications', 'Notifications', 'bell'],
    ['messages', 'Banners', 'msg']
  ]],
  ['System', [
    ['maintenance', 'Maintenance', 'cone'],
    ['settings', 'Settings', 'gear']
  ]]
];

function buildNav() {
  $('#nav').innerHTML = NAV.map(([cap, items]) =>
    `<div class="nav-cap">${cap}</div>` + items.map(([r, label, icon]) =>
      `<a class="nav-i" href="#${r}" data-route="${r}" title="${esc(label)}">
         ${ico(icon, 17)}<span class="nav-t">${esc(label)}</span></a>`).join('')
  ).join('');
}

/* ─── auth screens ────────────────────────────────────────────────── */
function showLogin(err) {
  $('#boot-sub').textContent = 'Sign in to manage RankSpark.';
  $('#boot-body').innerHTML = `
    ${err ? `<div class="note bad">${ico('warn', 14)}<span>${esc(err)}</span></div>` : ''}
    <form id="lf" style="margin-top:6px">
      <div class="field"><label for="li-e">Email</label>
        <input id="li-e" type="email" autocomplete="email" required placeholder="you@rankspark.app"></div>
      <div class="field"><label for="li-p">Password</label>
        <input id="li-p" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn btn-p btn-full" type="submit" id="li-go">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button class="btn btn-g btn-full" id="li-g">Continue with Google</button>
    <div class="note">${ico('info', 14)}<span>Access is limited to accounts listed in
      <b class="mono">/admins</b>. Signing in does not grant admin rights on its own.</span></div>`;

  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#li-go'); btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const { signInWithEmailAndPassword } = state.fb.mods.auth;
      await signInWithEmailAndPassword(state.fb.auth, $('#li-e').value, $('#li-p').value);
    } catch (er) {
      btn.disabled = false; btn.textContent = 'Sign in';
      showLogin(friendly(er.code));
    }
  };
  $('#li-g').onclick = async () => {
    try {
      const { GoogleAuthProvider, signInWithPopup } = state.fb.mods.auth;
      await signInWithPopup(state.fb.auth, new GoogleAuthProvider());
    } catch (er) { showLogin(friendly(er.code)); }
  };
}

const friendly = code => ({
  'auth/invalid-credential': 'That email and password do not match an account.',
  'auth/user-not-found': 'No account exists for that email.',
  'auth/wrong-password': 'Incorrect password.',
  'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
  'auth/popup-closed-by-user': 'Sign-in was cancelled.',
  'auth/network-request-failed': 'Network unreachable — check your connection.'
}[code] || 'Sign-in failed (' + (code || 'unknown') + ').');

function showDenied(email) {
  $('#boot-sub').textContent = 'This account cannot access the admin app.';
  $('#boot-body').innerHTML = `
    <div class="note bad">${ico('warn', 14)}<span>
      <b>Not authorised.</b> ${esc(email || 'This account')} is signed in but has no document at
      <b class="mono">/admins/{uid}</b>. Ask an existing admin to grant access.</span></div>
    <button class="btn btn-g btn-full" id="dn-out" style="margin-top:14px">Sign out</button>`;
  $('#dn-out').onclick = async () => {
    const { signOut } = state.fb.mods.auth;
    await signOut(state.fb.auth); location.reload();
  };
}

/* checkAdmin() previously had no failure path: if the Firestore read threw
   (rules not published yet, offline, misconfigured project, etc.) the
   promise rejected inside onAuthStateChanged with nothing awaiting it, so
   the boot screen sat on "Verifying admin access…" forever with no visible
   error. This surfaces the real cause and offers a retry. */
function showBootError(err, user) {
  $('#boot-sub').textContent = 'Could not verify admin access.';
  $('#boot-body').innerHTML = `
    <div class="note bad">${ico('warn', 14)}<span>
      <b>${esc(err?.code || 'Error')}.</b> ${esc(err?.message || String(err))}</span></div>
    <button class="btn btn-p btn-full" id="be-retry" style="margin-top:14px">Retry</button>
    <button class="btn btn-g btn-full" id="be-out" style="margin-top:8px">Sign out</button>`;
  $('#be-retry').onclick = async () => {
    $('#boot-sub').textContent = 'Verifying admin access…';
    $('#boot-body').innerHTML = '';
    try {
      const ok = await checkAdmin(user.uid);
      if (!ok) { showDenied(user.email); return; }
      enterApp(user);
    } catch (er) { showBootError(er, user); }
  };
  $('#be-out').onclick = async () => {
    const { signOut } = state.fb.mods.auth;
    await signOut(state.fb.auth); location.reload();
  };
}

function enterApp(user) {
  state.user = user;
  /* `hidden` is overridden by .auth{display:grid}, so the boot screen would
     stay in flow above the shell. Remove it outright. */
  document.getElementById('boot')?.remove();
  $('#shell').hidden = false;
  const name = user?.displayName || user?.email?.split('@')[0] || 'Demo admin';
  $('#side-name').textContent = name;
  $('#side-mail').textContent = user?.email || 'demo mode — no Firebase attached';
  $('#side-ava').textContent = name[0].toUpperCase();
  if (user?.photoURL) {
    $('#side-ava').style.backgroundImage = `url(${user.photoURL})`;
    $('#side-ava').textContent = '';
  }
  const live = state.live;
  $('#env').className = 'env' + (live ? '' : ' mock');
  $('#env-tx').textContent = live ? 'Production' : 'Demo data';
  buildNav();
  go(location.hash.slice(1) || 'dashboard');
}

/* ─── chrome wiring ───────────────────────────────────────────────── */
$('#collapse').onclick = () => {
  const s = $('#shell'); s.classList.toggle('collapsed');
  localStorage.setItem('rsadmin-collapsed', s.classList.contains('collapsed') ? '1' : '');
};
if (localStorage.getItem('rsadmin-collapsed')) $('#shell').classList.add('collapsed');

$('#burger').onclick = () => $('#side').classList.toggle('open');
$('#nav').addEventListener('click', () => $('#side').classList.remove('open'));

$('#theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('rsadmin-theme', next);
};
document.documentElement.dataset.theme = localStorage.getItem('rsadmin-theme') || 'dark';

$('#sign-out').onclick = async () => {
  if (state.live) { const { signOut } = state.fb.mods.auth; await signOut(state.fb.auth); }
  location.reload();
};

/* Global search doubles as a command palette over the nav. */
const ALL = NAV.flatMap(([, items]) => items);
$('#gsearch').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  $$('.nav-i').forEach(a => {
    const hit = !q || a.dataset.route.includes(q) || a.textContent.toLowerCase().includes(q);
    a.style.display = hit ? '' : 'none';
  });
  $$('.nav-cap').forEach(c => {
    let n = c.nextElementSibling, any = false;
    while (n && n.classList.contains('nav-i')) { if (n.style.display !== 'none') any = true; n = n.nextElementSibling; }
    c.style.display = any ? '' : 'none';
  });
});
$('#gsearch').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const first = $$('.nav-i').find(a => a.style.display !== 'none');
  if (first) { go(first.dataset.route); e.target.value = ''; e.target.dispatchEvent(new Event('input')); e.target.blur(); }
});

/* Keyboard shortcuts: / focuses search, g+key jumps, \ collapses. */
let gKey = false;
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === '/' && !typing) { e.preventDefault(); $('#gsearch').focus(); return; }
  if (e.key === '\\' && !typing) { e.preventDefault(); $('#collapse').click(); return; }
  if (typing) return;
  if (e.key.toLowerCase() === 'g') { gKey = true; setTimeout(() => gKey = false, 900); return; }
  if (!gKey) return;
  const map = { d: 'dashboard', b: 'books', u: 'users', p: 'pricing',
                l: 'live', n: 'notifications', m: 'messages', s: 'settings' };
  const r = map[e.key.toLowerCase()];
  if (r) { go(r); gKey = false; }
});

/* Let a leaving view clean up its listeners/intervals. */
const _page = $('#page');
new MutationObserver(() => {}).observe(_page, { childList: true });
const origGo = go;
window.addEventListener('hashchange', () => _page.dispatchEvent(new CustomEvent('rs-leave')));

/* ─── start ───────────────────────────────────────────────────────── */
(async function start() {
  await initFirebase();
  if (!state.live) {
    /* No Firebase config: run the whole dashboard against demo data so every
       screen can be reviewed. Explicitly labelled everywhere so it can never
       be mistaken for production. */
    enterApp({ email: '', displayName: 'Demo admin' });
    toast('Running on demo data — attach Firebase in Settings', 'ok');
    return;
  }
  const { onAuthStateChanged } = state.fb.mods.auth;
  onAuthStateChanged(state.fb.auth, async user => {
    if (!user) { showLogin(); return; }
    $('#boot-sub').textContent = 'Verifying admin access…';
    try {
      const ok = await checkAdmin(user.uid);
      if (!ok) { showDenied(user.email); return; }
      enterApp(user);
    } catch (er) { showBootError(er, user); }
  });
})();

})();
</script>
